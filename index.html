<DOCTYPE html>
<html>
<head>
<title>Catch The Box</title>
<style>
  body {
    text-align: center;
    font-family: Arial;
    background-color: #f0f0f0;
  }
  #gameArea {
    width: 300px;
    height: 300px;
    margin: 20px auto;
    position: relative;
    background-color: white;
    border: 2px solid black;
  }
  #box {
    width: 50px;
    height: 50px;
    background-color: red;
    position: absolute;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>Catch The Box Game</h2>
<p>Score: <span id="score">0</span></p>

<div id="gameArea">
  <div id="box"></div>
</div>

<script>
let box = document.getElementById("box");
let score = 0;

function moveBox() {
  let x = Math.random() * 250;
  let y = Math.random() * 250;
  box.style.left = x + "px";
  box.style.top = y + "px";
}

box.onclick = function() {
  score++;
  document.getElementById("score").innerText = score;
  moveBox();
};

moveBox();
</script>

</body>
</html>
